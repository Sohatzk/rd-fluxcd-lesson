apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
  
resources:
- ../../base/
- namespace.yaml

patches: 
- patch: |-
    - op: add
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
- patch: |-
    - op: remove
    path: ../../base/
  target:
    kind: Dragonfly

