apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
  
resources:
- ../../base/course-app
- namespace.yaml
- course-app-hpa.yaml

patches: 
- path: course-app-deployment.yaml
- patch: |-
    - op: add
      path: /metadata/namespace
      value: production
  target:
    kind: Deployment
- patch: |-
    - op: add
      path: /spec/replicas
      value: 2
  target:
    kind: Dragonfly
- patch: |-
    - op: replace
      path: /metadata/namespace
      value: production
  target:
    kind: Service
    name: course-app-service
- patch: |-
    - op: replace
      path: /spec/ports/0/port
      value: 8081
  target:
    kind: Service
- patch: |-
    - op: replace
      path: /metadata/namespace
      value: production
  target:
    kind: Ingress
- patch: |-
    - op: replace
      path: /spec/rules/0/http/paths/0/backend/service/port/number
      value: 8081
  target:
    kind: Ingress
