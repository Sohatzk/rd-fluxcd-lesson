apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
  
resources:
- ../../base/course-app
- namespace.yaml
- course-app-ingress.yaml
- course-app-hpa.yaml

patches: 
- path: course-app-deployment.yaml
- path: course-app-service.yaml
- patch: |-
    - op: add
      path: /metadata/namespace
      value: production
  target:
    kind: Deployment
- patch: |-
    - op: add
      path: /metadata/namespace
      value: production
  target:
    kind: Service
- patch: |-
    - op: add
      path: /spec/replicas
      value: 2
  target:
    kind: Dragonfly