apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dragonfly-flux-kustomization
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: dragonfly-operator-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "../../../base/dragonfly"
  prune: true
  timeout: 1m