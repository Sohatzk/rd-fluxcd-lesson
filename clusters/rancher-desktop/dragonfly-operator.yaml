apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dragonfly-operator
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: dragonfly-operator-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: "./infrastructure/controllers/dragonfly/kustomization.yaml"
  prune: true
  timeout: 1m